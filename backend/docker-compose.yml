services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safaricom_task_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1
    networks:
      - task_net

networks:
  task_net:
    name: safaricom_task_net
